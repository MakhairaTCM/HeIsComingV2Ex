<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixiEx1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.13.2/pixi.min.js" integrity="sha512-rOMqai9NIPaFWpmvHUjdOa2dSuaaYo6i7E19jS1ZW9rjnrl4qAOOtsOeTk0QgIflFCe2ZYi/7or3CRF6VfBk9g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js" referrerpolicy="no-referrer"></script>
</head>
<body>
    <script type="text/javascript">
        (async () =>{
            const app = new PIXI.Application();
            await app.init({ background: '#1099bb', resizeTo: window});
            document.body.appendChild(app.canvas);

            const gameContainer = new PIXI.Container();
            app.stage.addChild(gameContainer);

            const mapContainer = new PIXI.Container();

            const response = await axios.get("https://mmi.alarmitou.fr/api/map");
            const grid = response.data;
            const roadTile = new PIXI.GraphicsContext().rect(50,50,50,50).fill("brown");
            const forestTile = new PIXI.GraphicsContext().rect(50,50,50,50).fill("green");

            for (let y=0; y < grid.length; y++){
                for (let x=0; x<grid[y].length; x++){
                    const tileGraphicContext = grid[y][x] == 0 ? forestTile : roadTile;
                    const tile = new PIXI.Graphics(tileGraphicContext);
                    tile.x = x*50;
                    tile.y = y*50;
                    mapContainer.addChild(tile);
                }
            }

           gameContainer.addChild(mapContainer);

        })();

    </script>
    
</body>
</html>
